<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="boim">
        <h1 class="text">Hello! What can I do for you today?</h1>
    </div>
</body>
<style>
    body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, #000 0%, #000 70%, #b000a4 100%);
        background-size: 100% 115%;
        animation: rise-magenta 10s ease-in-out infinite;
    }

    .boim {
        min-height: 100vh;
        display: grid;
        place-items: center;
    }

    .text {
        margin: 0;
        font-size: clamp(2.5rem, 10vw, 100px);
        font-weight: bold;
        text-align: center;
        background-image:
            radial-gradient(ellipse 65% 100% at 15% 55%, #8b36f5 0%, transparent 75%),
            radial-gradient(ellipse 70% 90% at 50% 40%, #f05ab8 0%, transparent 76%),
            radial-gradient(ellipse 60% 100% at 88% 55%, #fff 0%, #ffe8f4 28%, transparent 75%),
            linear-gradient(110deg, #7e3bd8, #ec65bb 52%, #fff);
        background-size: 180% 180%;
        background-position: 0% 50%;
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        animation: drift-dye 7s ease-in-out infinite;
    }

    @keyframes rise-magenta {
        0%,
        100% {
            background-position: 0% 0%;
        }

        50% {
            background-position: 0% 100%;
        }
    }

    @keyframes drift-dye {
        from {
            background-position: 0% 45%;
        }

        to {
            background-position: 100% 55%;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        body {
            animation: none;
        }

        .text {
            animation: none;
        }
    }
</style>
</html>
